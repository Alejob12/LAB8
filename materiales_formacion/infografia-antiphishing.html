<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infografía y Checklist Anti-Phishing — AndesCorp S.A.</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #e2e8f0; color: #0f172a; margin: 0; padding: 24px;
    }
    .toolbar {
      max-width: 980px; margin: 0 auto 16px; display: flex; justify-content: space-between;
      align-items: center; background: #0f2942; color: #fff; padding: 14px 20px; border-radius: 10px;
    }
    .toolbar button {
      background: #d97706; color: #fff; border: 0; padding: 10px 16px; border-radius: 8px;
      font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .sheet {
      max-width: 980px; margin: 0 auto 24px; background: #fff; border-radius: 12px;
      overflow: hidden; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
    }
    .sheet img { width: 100%; display: block; }
    .interactive-check {
      max-width: 980px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px 28px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }
    .interactive-check h2 { margin-top: 0; color: #0f2942; }
    .check-item {
      display: flex; align-items: flex-start; gap: 12px; padding: 10px 0;
      border-bottom: 1px solid #f1f5f9; font-size: 15px;
    }
    .check-item input { transform: scale(1.25); margin-top: 3px; }
    @media print {
      body { background: #fff; padding: 0; }
      .toolbar, .interactive-check { display: none; }
      .sheet { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div><strong>Material Formativo RR.HH.</strong> — Infografía Anti-Phishing (AndesCorp S.A.)</div>
    <button onclick="window.print()">Imprimir / Guardar en PDF</button>
  </div>

  <div class="sheet">
    <img src="infografia-antiphishing.svg" alt="Infografía Visual Anti-Phishing AndesCorp S.A.">
  </div>

  <section class="interactive-check">
    <h2>Autoevaluación rápida (Checklist Interactiva)</h2>
    <label class="check-item"><input type="checkbox"> Verifico siempre el dominio exacto del remitente (<code>@andescorp.local</code>) antes de confiar en un correo.</label>
    <label class="check-item"><input type="checkbox"> Paso el cursor sobre enlaces y botones para inspeccionar la URL real sin hacer clic.</label>
    <label class="check-item"><input type="checkbox"> Nunca ingreso mis credenciales en un enlace recibido por correo: abro el portal SSO oficial desde mis marcadores.</label>
    <label class="check-item"><input type="checkbox"> Desconfío de mensajes que imponen plazos urgentes (ej. "2 horas antes de bloqueo").</label>
    <label class="check-item"><input type="checkbox"> Sé cómo reportar un posible incidente real al CSIRT (<code>csirt@andescorp.local</code> / Ext. 4911).</label>
  </section>
</body>
</html>
