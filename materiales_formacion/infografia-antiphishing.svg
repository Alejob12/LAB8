<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" width="1200" height="1560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="1560" fill="#F1F5F9"/>

  <!-- Encabezado -->
  <rect width="1200" height="210" fill="url(#headerGrad)"/>
  <rect y="204" width="1200" height="6" fill="url(#amberGrad)"/>
  <text x="70" y="64" fill="#FBBF24" font-size="18" font-weight="700" letter-spacing="2">ANDESCORP S.A. · PROGRAMA DE CONCIENTIZACIÓN EN CIBERSEGURIDAD</text>
  <text x="70" y="122" fill="#FFFFFF" font-size="44" font-weight="800">Guía Visual Anti-Phishing</text>
  <text x="70" y="164" fill="#CBD5E1" font-size="22">Cómo detectar, frenar y reportar intentos de suplantación de identidad y portales falsos</text>

  <!-- Escudo decorativo -->
  <g transform="translate(1015, 42)">
    <path d="M55 0 L110 22 V66 C110 100 84 124 55 136 C26 124 0 100 0 66 V22 Z" fill="#1E40AF" stroke="#FBBF24" stroke-width="4"/>
    <path d="M35 66 L50 82 L80 48" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sección 1: Regla P.A.R.A. -->
  <text x="70" y="268" fill="#0F2942" font-size="26" font-weight="800">1. Aplica siempre el método P.A.R.A.</text>

  <!-- Tarjeta P -->
  <g transform="translate(70, 290)" filter="url(#shadow)">
    <rect width="248" height="205" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="48" cy="48" r="24" fill="#FEF3C7"/>
    <text x="48" y="56" text-anchor="middle" fill="#B45309" font-size="24" font-weight="800">P</text>
    <text x="86" y="56" fill="#0F2942" font-size="22" font-weight="700">PAUSA</text>
    <text x="24" y="102" fill="#334155" font-size="16">Los atacantes fabrican</text>
    <text x="24" y="126" fill="#334155" font-size="16">urgencia extrema ("en 2h</text>
    <text x="24" y="150" fill="#334155" font-size="16">se bloquea tu cuenta")</text>
    <text x="24" y="174" fill="#334155" font-size="16">para evitar que pienses.</text>
  </g>

  <!-- Tarjeta A -->
  <g transform="translate(340, 290)" filter="url(#shadow)">
    <rect width="248" height="205" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="48" cy="48" r="24" fill="#DBEAFE"/>
    <text x="48" y="56" text-anchor="middle" fill="#1D4ED8" font-size="24" font-weight="800">A</text>
    <text x="86" y="56" fill="#0F2942" font-size="22" font-weight="700">ANALIZA</text>
    <text x="24" y="102" fill="#334155" font-size="16">Revisa letra por letra el</text>
    <text x="24" y="126" fill="#334155" font-size="16">dominio del remitente y</text>
    <text x="24" y="150" fill="#334155" font-size="16">pasa el cursor sobre el</text>
    <text x="24" y="174" fill="#334155" font-size="16">enlace antes de pulsar.</text>
  </g>

  <!-- Tarjeta R -->
  <g transform="translate(610, 290)" filter="url(#shadow)">
    <rect width="248" height="205" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="48" cy="48" r="24" fill="#FEE2E2"/>
    <text x="48" y="56" text-anchor="middle" fill="#B91C1C" font-size="24" font-weight="800">R</text>
    <text x="86" y="56" fill="#0F2942" font-size="22" font-weight="700">REPORTA</text>
    <text x="24" y="102" fill="#334155" font-size="16">Reenvía el correo al</text>
    <text x="24" y="126" fill="#334155" font-size="16">CSIRT corporativo:</text>
    <text x="24" y="152" fill="#B91C1C" font-size="15" font-weight="700">csirt@andescorp.local</text>
    <text x="24" y="176" fill="#334155" font-size="16">o llama a la Ext. 4911.</text>
  </g>

  <!-- Tarjeta A2 -->
  <g transform="translate(880, 290)" filter="url(#shadow)">
    <rect width="250" height="205" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="48" cy="48" r="24" fill="#DCFCE7"/>
    <text x="48" y="56" text-anchor="middle" fill="#15803D" font-size="24" font-weight="800">A</text>
    <text x="86" y="56" fill="#0F2942" font-size="22" font-weight="700">APRENDE</text>
    <text x="24" y="102" fill="#334155" font-size="16">Usa siempre marcadores</text>
    <text x="24" y="126" fill="#334155" font-size="16">propios para el SSO,</text>
    <text x="24" y="150" fill="#334155" font-size="16">contraseñas únicas y</text>
    <text x="24" y="174" fill="#334155" font-size="16">verificación MFA activa.</text>
  </g>

  <!-- Sección 2: 6 Banderas Rojas -->
  <text x="70" y="558" fill="#0F2942" font-size="26" font-weight="800">2. Seis banderas rojas de un ataque de Phishing / Evil-Twin</text>

  <g transform="translate(70, 582)" filter="url(#shadow)">
    <rect width="1060" height="415" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Fila 1 -->
    <g transform="translate(30, 30)">
      <rect width="315" height="165" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
      <text x="18" y="34" fill="#9A3412" font-size="18" font-weight="700">① Dominio Lookalike</text>
      <text x="18" y="66" fill="#334155" font-size="15">Remitente falso:</text>
      <text x="18" y="90" fill="#B91C1C" font-size="14" font-weight="700">soporte@andescorp-ti.local</text>
      <text x="18" y="120" fill="#334155" font-size="15">Dominio oficial correcto:</text>
      <text x="18" y="144" fill="#15803D" font-size="14" font-weight="700">soporte@andescorp.local</text>
    </g>

    <g transform="translate(372, 30)">
      <rect width="315" height="165" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
      <text x="18" y="34" fill="#991B1B" font-size="18" font-weight="700">② Presión y Urgencia</text>
      <text x="18" y="68" fill="#334155" font-size="15">Frases como "Acción obligatoria</text>
      <text x="18" y="92" fill="#334155" font-size="15">hoy", "Cuenta suspendida en 2h"</text>
      <text x="18" y="116" fill="#334155" font-size="15">o "Último aviso de nómina"</text>
      <text x="18" y="140" fill="#334155" font-size="15">buscan inducir errores rápidos.</text>
    </g>

    <g transform="translate(714, 30)">
      <rect width="315" height="165" rx="10" fill="#EFF6FF" stroke="#93C5FD"/>
      <text x="18" y="34" fill="#1E40AF" font-size="18" font-weight="700">③ URL de Portal Clonado</text>
      <text x="18" y="68" fill="#334155" font-size="15">Un "Evil-Twin" copia el logo y</text>
      <text x="18" y="92" fill="#334155" font-size="15">los colores corporativos, pero</text>
      <text x="18" y="116" fill="#334155" font-size="15">la barra de direcciones delata</text>
      <text x="18" y="140" fill="#334155" font-size="15">un host distinto al oficial.</text>
    </g>

    <!-- Fila 2 -->
    <g transform="translate(30, 218)">
      <rect width="315" height="165" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="18" y="34" fill="#0F2942" font-size="18" font-weight="700">④ Solicitud de Contraseñas</text>
      <text x="18" y="68" fill="#334155" font-size="15">Ningún equipo de TI o RR.HH.</text>
      <text x="18" y="92" fill="#334155" font-size="15">te pedirá validar tu clave ni</text>
      <text x="18" y="116" fill="#334155" font-size="15">códigos MFA por correo, chat</text>
      <text x="18" y="140" fill="#334155" font-size="15">o formularios externos.</text>
    </g>

    <g transform="translate(372, 218)">
      <rect width="315" height="165" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="18" y="34" fill="#0F2942" font-size="18" font-weight="700">⑤ Enlaces Acortados / Ocultos</text>
      <text x="18" y="68" fill="#334155" font-size="15">El texto del botón puede decir</text>
      <text x="18" y="92" fill="#334155" font-size="15">"Portal SSO", pero el destino</text>
      <text x="18" y="116" fill="#334155" font-size="15">real apunta a otra dirección.</text>
      <text x="18" y="140" fill="#334155" font-size="15">Verifica siempre el enlace real.</text>
    </g>

    <g transform="translate(714, 218)">
      <rect width="315" height="165" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="18" y="34" fill="#0F2942" font-size="18" font-weight="700">⑥ Sin Canal de Verificación</text>
      <text x="18" y="68" fill="#334155" font-size="15">Ante cualquier duda, confirma</text>
      <text x="18" y="92" fill="#334155" font-size="15">por un canal alterno oficial</text>
      <text x="18" y="116" fill="#334155" font-size="15">(intranet, teléfono interno o</text>
      <text x="18" y="140" fill="#334155" font-size="15">mesa de ayuda verificada).</text>
    </g>
  </g>

  <!-- Sección 3: Checklist y Flujo de Reporte -->
  <text x="70" y="1062" fill="#0F2942" font-size="26" font-weight="800">3. Checklist rápida y qué hacer ante un incidente real</text>

  <!-- Columna izquierda: Checklist -->
  <g transform="translate(70, 1086)" filter="url(#shadow)">
    <rect width="510" height="360" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect width="510" height="52" rx="16" fill="#0F2942"/>
    <rect y="36" width="510" height="16" fill="#0F2942"/>
    <text x="26" y="34" fill="#FFFFFF" font-size="19" font-weight="700">Checklist antes de iniciar sesión</text>

    <g font-size="16" fill="#1E293B">
      <text x="28" y="92">☑ ¿Llegué al portal escribiendo la URL o por marcador?</text>
      <text x="28" y="136">☑ ¿El dominio exacto es sso.andescorp.local?</text>
      <text x="28" y="180">☑ ¿El correo remitente pertenece a @andescorp.local?</text>
      <text x="28" y="224">☑ ¿Verifiqué si existe un aviso oficial en la intranet?</text>
      <text x="28" y="268">☑ ¿Mi gestor de contraseñas reconoce el sitio?</text>
      <text x="28" y="312">☑ ¿Tengo activo el doble factor de autenticación (MFA)?</text>
    </g>
  </g>

  <!-- Columna derecha: Pasos incidente real -->
  <g transform="translate(620, 1086)" filter="url(#shadow)">
    <rect width="510" height="360" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect width="510" height="52" rx="16" fill="#B91C1C"/>
    <rect y="36" width="510" height="16" fill="#B91C1C"/>
    <text x="26" y="34" fill="#FFFFFF" font-size="19" font-weight="700">Si sospechas un ataque REAL, haz esto:</text>

    <g font-size="15.5" fill="#1E293B">
      <circle cx="42" cy="90" r="14" fill="#FEE2E2"/>
      <text x="42" y="95" text-anchor="middle" fill="#B91C1C" font-weight="800">1</text>
      <text x="68" y="95">No respondas, no reenvíes a colegas ni descargues adjuntos.</text>

      <circle cx="42" cy="148" r="14" fill="#FEE2E2"/>
      <text x="42" y="153" text-anchor="middle" fill="#B91C1C" font-weight="800">2</text>
      <text x="68" y="146">Reporta al CSIRT: csirt@andescorp.local (Ext. 4911)</text>
      <text x="68" y="168" fill="#64748B" font-size="14">Adjunta el correo original o captura de pantalla.</text>

      <circle cx="42" cy="214" r="14" fill="#FEE2E2"/>
      <text x="42" y="219" text-anchor="middle" fill="#B91C1C" font-weight="800">3</text>
      <text x="68" y="212">Si ingresaste tu clave real: cámbiala de inmediato desde</text>
      <text x="68" y="234" fill="#64748B" font-size="14">el portal oficial y en cualquier otro servicio repetido.</text>

      <circle cx="42" cy="284" r="14" fill="#FEE2E2"/>
      <text x="42" y="289" text-anchor="middle" fill="#B91C1C" font-weight="800">4</text>
      <text x="68" y="282">No apagues ni borres evidencia: el CSIRT revocará</text>
      <text x="68" y="304" fill="#64748B" font-size="14">sesiones activas y bloqueará el dominio malicioso.</text>
    </g>
  </g>

  <!-- Pie de página -->
  <rect y="1482" width="1200" height="78" fill="#0F2942"/>
  <text x="600" y="1518" text-anchor="middle" fill="#E2E8F0" font-size="16" font-weight="600">
    AndesCorp S.A. · Material Didáctico de Concientización (Basado en guías NIST SP 800-50 y SANS)
  </text>
  <text x="600" y="1542" text-anchor="middle" fill="#94A3B8" font-size="13">
    Laboratorio 8 de Ciberseguridad · Entorno Ficticio y Controlado · Privacidad por Diseño (Cero retención de contraseñas)
  </text>
</svg>
